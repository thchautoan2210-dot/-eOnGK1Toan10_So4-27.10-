                    { t: 'Có đúng 2 giá trị của $x$ để mệnh đề $P(x) \\Rightarrow Q(x)$ là mệnh đề sai.', ans: true }
                ],
                exp: 'Tập hợp làm $P(x)$ đúng: $\\{3; 6; 9; 12\\}$. Tập hợp làm $Q(x)$ đúng: $\\{6; 12\\}$.<br><br>a) $P(9)$ đúng vì $9 \\vdots 3$. $\\Rightarrow$ Đúng.<br><br>b) $Q(9)$ sai vì 9 không chia hết cho 6. $\\Rightarrow$ Sai.<br><br>c) $Q(x)$ đúng thì $P(x)$ luôn đúng (chia hết cho 6 thì chắc chắn chia hết cho 3). Nên mệnh đề kéo theo $Q \\Rightarrow P$ là đúng. Lúc này, mệnh đề đứng sau (tức $P$) được gọi là điều kiện cần. $\\Rightarrow$ Đúng.<br><br>d) Mệnh đề $P(x) \\Rightarrow Q(x)$ bị sai khi $P$ ĐÚNG nhưng $Q$ SAI. Nhìn vào tập hợp, các số làm $P$ đúng mà $Q$ sai là $3$ và $9$. Có đúng 2 giá trị. $\\Rightarrow$ Đúng.' },
            { id: 16, type: 'p2', part: 2, q: 'Cho tam giác $ABC$ có $BC = 7, CA = 5, AB = 8$. Gọi $I$ là giao điểm của ba đường phân giác trong của $\\triangle ABC$.',
                img: '<img src="Screenshot 2026-10-27 152920.png" onerror="this.src=\'https://placehold.co/400x250/e2e8f0/475569?text=Hinh+Anh+Cau+16\'" class="max-w-full md:max-w-md h-auto rounded-xl shadow-md border-2 border-gray-200 mx-auto my-4 object-contain">',
                statements: [
                    { t: '$\\widehat{A} = 60^\\circ$', ans: true },
                    { t: '$S_{ABC} = 10\\sqrt{3}$', ans: true },
                    { t: '$r = 2\\sqrt{3}$', ans: false },
                    { t: '$AI = 2\\sqrt{3}$', ans: true }
                ],
                exp: '($a=7, b=5, c=8$)<br><br>a) $\\cos A = \\frac{5^2 + 8^2 - 7^2}{2 \\cdot 5 \\cdot 8} = \\frac{40}{80} = \\frac{1}{2} \\Rightarrow \\widehat{A} = 60^\\circ$. $\\Rightarrow$ Đúng.<br><br>b) $S = \\frac{1}{2} bc \\sin A = \\frac{1}{2} \\cdot 5 \\cdot 8 \\cdot \\sin 60^\\circ = 10\\sqrt{3}$. $\\Rightarrow$ Đúng.<br><br>c) Bán kính đường tròn nội tiếp $r = \\frac{S}{p}$. Nửa chu vi $p = \\frac{7+5+8}{2} = 10$. Vậy $r = \\frac{10\\sqrt{3}}{10} = \\sqrt{3}$. (Đề nói $2\\sqrt{3}$) $\\Rightarrow$ Sai.<br><br>d) Khoảng cách từ tâm $I$ tới cạnh $AB$ chính là $r = \\sqrt{3}$. Góc $\\widehat{IAB} = \\frac{1}{2}\\widehat{A} = 30^\\circ$. Xét tam giác vuông tạo bởi $A, I$ và hình chiếu của $I$ xuống $AB$: $AI = \\frac{r}{\\sin 30^\\circ} = \\frac{\\sqrt{3}}{0,5} = 2\\sqrt{3}$. $\\Rightarrow$ Đúng.' },

            // --- PHẦN 3 ---
            { id: 17, type: 'p3', part: 3, q: 'Cho hai tập hợp $A = [-4; 3)$, $B = [m; m+2]$, với $m \\in \\mathbb{Z}$, $-8 \\le m \\le 5$. Có bao nhiêu giá trị của $m$ để $A \\cap B = \\emptyset$?',
                ans: 5, exp: 'Để $A \\cap B = \\emptyset$, toàn bộ tập $B$ phải nằm hoàn toàn bên trái $A$ hoặc nằm hoàn toàn bên phải $A$.<br>- Nằm bên trái: $m + 2 < -4 \\Leftrightarrow m < -6$. Vì $m \\in \\mathbb{Z}$ và $m \\ge -8$ nên $m \\in \\{-8; -7\\}$. (2 giá trị)<br>- Nằm bên phải: $m \\ge 3$. Vì $m \\le 5$ nên $m \\in \\{3; 4; 5\\}$. (3 giá trị)<br>Tổng cộng có $2 + 3 = 5$ giá trị thỏa mãn.<br><br><b>Đáp số: 5.</b>' },
            { id: 18, type: 'p3', part: 3, q: 'Cho hai mệnh đề chứa biến $P(x): 2x + 7 > 0$, $Q(x): x^2(x - 2) < 0$, $x \\in \\mathbb{Z}$. Có bao nhiêu giá trị nguyên của $x$ để $P(x)$ và $Q(x)$ đồng thời trở thành các mệnh đề đúng?',
                ans: 4, exp: 'Từ $P(x): 2x > -7 \\Rightarrow x > -3,5$.<br>Từ $Q(x): x^2(x - 2) < 0$. Vì $x^2 \\ge 0$ nên buộc $x^2 \\neq 0$ (tức $x \\neq 0$) và $x - 2 < 0 \\Rightarrow x < 2$.<br>Kết hợp lại, ta có: $-3,5 < x < 2$ và $x \\neq 0$. Các số nguyên thỏa mãn là $\\{-3; -2; -1; 1\\}$. Có 4 giá trị.<br><br><b>Đáp số: 4.</b>' },
            { id: 19, type: 'p3', part: 3, q: 'Cho tam giác $ABC$ có $\\widehat{A} = 30^\\circ$, $\\widehat{B} = 60^\\circ$ và chu vi bằng $6 + 2\\sqrt{3}$. Tính diện tích tam giác $ABC$. (Kết quả làm tròn đến hàng phần mười).',
                ans: 3.5, exp: 'Tính được $\\widehat{C} = 180^\\circ - (30^\\circ + 60^\\circ) = 90^\\circ$, tam giác vuông tại $C$.<br>Gọi $c$ là độ dài cạnh huyền $AB$. Ta có các góc vuông $a = c \\cdot \\sin 30^\\circ = \\frac{c}{2}$ và $b = c \\cdot \\sin 60^\\circ = \\frac{c\\sqrt{3}}{2}$.<br>Chu vi: $c + \\frac{c}{2} + \\frac{c\\sqrt{3}}{2} = c \\frac{3+\\sqrt{3}}{2} = 6 + 2\\sqrt{3} = 2(3+\\sqrt{3})$.<br>Suy ra $c = 4$. Từ đó, hai cạnh góc vuông là $a = 2$ và $b = 2\\sqrt{3}$.<br>Diện tích $S = \\frac{1}{2}ab = \\frac{1}{2} \\cdot 2 \\cdot 2\\sqrt{3} = 2\\sqrt{3} \\approx 3,464$. Làm tròn đến hàng phần mười ta được $3,5$.<br><br><b>Đáp số: 3,5.</b>' },
            { id: 20, type: 'p3', part: 3, q: 'Muốn đo chiều cao của một ngọn tháp, người ta chọn hai điểm $A$ và $B$ trên mặt đất... Tính chiều cao $CD$ của ngọn tháp (m).',
                img: '<img src="Screenshot 2026-10-27 153128.png" onerror="this.src=\'https://placehold.co/400x250/e2e8f0/475569?text=Hinh+Anh+Cau+20\'" class="max-w-full md:max-w-md h-auto rounded-xl shadow-md border-2 border-gray-200 mx-auto my-4 object-contain">',
                ans: 31.5, exp: 'Gọi độ dài đoạn $DC_1 = x$ (m, $x > 0$).<br>Trong tam giác vuông $DA_1C_1$, do $\\widehat{DA_1C_1} = 45^\\circ$ nên tam giác này vuông cân tại $C_1$, suy ra $A_1C_1 = DC_1 = x$.<br>Trong tam giác vuông $DB_1C_1$, ta có $B_1C_1 = A_1C_1 + A_1B_1 = x + 10$.<br>Áp dụng định lý Pythagoras: $DC_1^2 + B_1C_1^2 = DB_1^2 \\Leftrightarrow x^2 + (x+10)^2 = 50^2$.<br>Giải phương trình: $2x^2 + 20x - 2400 = 0 \\Leftrightarrow x^2 + 10x - 1200 = 0 \\Leftrightarrow x = 30$ hoặc $x = -40$ (loại).<br>Vậy $DC_1 = 30$ m. Chiều cao ngọn tháp là $CD = DC_1 + C_1C = 30 + 1,5 = 31,5$ (m).<br><br><b>Đáp số: 31,5.</b>' },
            { id: 21, type: 'p3', part: 3, q: 'Một điểm $P$ nằm trong tam giác đều $ABC$ sao cho $PA = 5, PB = 12, PC = 13$. Bình phương độ dài cạnh của tam giác $ABC$ có thể viết dưới dạng $a + b\\sqrt{3}$. Tính $a + b$.',
                img: '<img src="Screenshot 2026-10-27 153208.png" onerror="this.src=\'https://placehold.co/400x300/e2e8f0/475569?text=Hinh+Anh+Cau+21\'" class="max-w-full md:max-w-md h-auto rounded-xl shadow-md border-2 border-gray-200 mx-auto my-4 object-contain">',
                ans: 229, exp: 'Đây là dạng bài dựng hình phụ quen thuộc ở lớp 10. Bên ngoài $\\triangle ABC$, ta dựng $\\triangle BQC$ bằng $\\triangle BPA$ (sao cho $CQ = PA = 5$, $BQ = BP = 12$).<br>Ta có $\\widehat{CBQ} = \\widehat{ABP}$.<br>Suy ra góc $\\widehat{PBQ} = \\widehat{PBC} + \\widehat{CBQ} = \\widehat{PBC} + \\widehat{ABP} = \\widehat{ABC} = 60^\\circ$.<br>Tam giác $PBQ$ có $BP = BQ = 12$ và $\\widehat{PBQ} = 60^\\circ$ nên là tam giác đều, suy ra $PQ = 12$.<br>Xét $\\triangle PQC$ có ba cạnh là $5, 12, 13$. Do $5^2 + 12^2 = 13^2$ nên $\\triangle PQC$ vuông tại $Q$ (theo Pytago đảo), suy ra $\\widehat{PQC} = 90^\\circ$.<br>Từ đó, góc $\\widehat{BQC} = \\widehat{BQP} + \\widehat{PQC} = 60^\\circ + 90^\\circ = 150^\\circ$.<br>Áp dụng định lý côsin trong $\\triangle BQC$:$BC^2 = BQ^2 + CQ^2 - 2 \\cdot BQ \\cdot CQ \\cdot \\cos 150^\\circ = 12^2 + 5^2 - 2(12)(5)\\left(-\\frac{\\sqrt{3}}{2}\\right) = 144 + 25 + 60\\sqrt{3} = 169 + 60\\sqrt{3}$.<br>Theo đề $BC^2 = a + b\\sqrt{3}$ nên $a = 169, b = 60$. Tổng $a + b = 169 + 60 = 229$.<br><br><b>Đáp số: 229.</b>' }
        ];

        let currentIndex = 0;
        let isSubmitted = false;
        let savedAnswers = JSON.parse(localStorage.getItem('toan10_de4_game')) || { p1: {}, p2: {}, p3: {} };
        let checkedQuestions = JSON.parse(localStorage.getItem('toan10_de4_checked')) || {};

        window.onload = () => {
            goToQuestion(0);
        };

        function navigate(dir) {
            const newIndex = currentIndex + dir;
            if(newIndex >= 0 && newIndex < questionsData.length) {
                goToQuestion(newIndex);
            }
        }

        function goToQuestion(index) {
            currentIndex = index;
            const q = questionsData[index];
            const isQuestionChecked = isSubmitted || checkedQuestions[q.id];
            
            document.getElementById('question-counter').innerText = `${index + 1} / ${questionsData.length}`;
            const badge = document.getElementById('question-badge');
            if (q.part === 1) { badge.innerText = "Phần 1: Trắc nghiệm"; badge.className = "bg-green-100 text-green-800 text-sm font-bold px-3 py-1 rounded-full uppercase tracking-wide"; }
            if (q.part === 2) { badge.innerText = "Phần 2: Đúng/Sai"; badge.className = "bg-purple-100 text-purple-800 text-sm font-bold px-3 py-1 rounded-full uppercase tracking-wide"; }
            if (q.part === 3) { badge.innerText = "Phần 3: Trả lời ngắn"; badge.className = "bg-orange-100 text-orange-800 text-sm font-bold px-3 py-1 rounded-full uppercase tracking-wide"; }
            
            document.getElementById('question-title').innerText = `Câu ${q.id > 12 && q.id <= 16 ? q.id - 12 : (q.id > 16 ? q.id - 16 : q.id)}`;

            const container = document.getElementById('question-content-container');
            container.classList.remove('fade-enter');
            void container.offsetWidth;
            container.classList.add('fade-enter');

            document.getElementById('q-text').innerHTML = q.q;
            
            const imgContainer = document.getElementById('q-image');
            if(q.img) {
                imgContainer.innerHTML = q.img;
                imgContainer.style.display = 'flex';
            } else {
                imgContainer.style.display = 'none';
            }

            renderOptions(q);
            
            document.getElementById('btn-prev').style.visibility = index === 0 ? 'hidden' : 'visible';
            document.getElementById('btn-next').style.visibility = index === questionsData.length - 1 ? 'hidden' : 'visible';

            const checkBtn = document.getElementById('q-check-btn-container');
            if (!isQuestionChecked) {
                checkBtn.classList.remove('hidden');
                checkBtn.classList.add('flex');
                document.getElementById('check-error-msg').classList.add('hidden');
            } else {
                checkBtn.classList.add('hidden');
                checkBtn.classList.remove('flex');
            }

            const expDiv = document.getElementById('q-explanation');
            if (isQuestionChecked) {
                expDiv.classList.remove('hidden');
                document.getElementById('exp-text').innerHTML = q.exp;
            } else {
                expDiv.classList.add('hidden');
            }

            if(window.MathJax) {
                MathJax.typesetPromise([document.getElementById('question-content-container')]).catch((err) => console.log(err.message));
            }
            container.scrollTop = 0;
        }

        function renderOptions(q) {
            const optsContainer = document.getElementById('q-options');
            optsContainer.innerHTML = '';

            const isQuestionChecked = isSubmitted || checkedQuestions[q.id];
            const disabledAttr = isQuestionChecked ? 'disabled' : '';

            if (q.type === 'p1') {
                const savedVal = savedAnswers.p1[q.id];
                q.options.forEach((opt, idx) => {
                    const letter = String.fromCharCode(65 + idx);
                    const isChecked = savedVal === idx;
                    
                    let bgClass = "bg-white";
                    let borderClass = "border-gray-200";
                    
                    if (isQuestionChecked) {
                        if (idx === q.ans) { bgClass = "bg-green-100"; borderClass = "border-green-500 font-bold"; }
                        else if (isChecked) { bgClass = "bg-red-100"; borderClass = "border-red-500"; }
                    } else if (isChecked) {
                        bgClass = "bg-green-50"; borderClass = "border-green-500";
                    }

                    optsContainer.innerHTML += `
                        <label class="flex items-center p-4 mb-4 rounded-xl border-2 ${borderClass} ${bgClass} cursor-pointer transition-all hover:shadow-md" onclick="if(!${isQuestionChecked}) handleP1(${q.id}, ${idx})">
                            <input type="radio" name="p1q${q.id}" value="${idx}" ${isChecked ? 'checked' : ''} ${disabledAttr} class="w-6 h-6 text-green-600 mr-4">
                            <span class="text-xl"><b class="mr-3">${letter}.</b> ${opt}</span>
                        </label>`;
                });
            } 
            else if (q.type === 'p2') {
                let tableHtml = `<div class="overflow-x-auto rounded-xl border border-gray-200 shadow-sm">
                    <table class="w-full tf-table bg-white">
                        <tr class="bg-gray-50"><th class="text-gray-600 text-lg">Phát biểu</th><th class="w-24 text-gray-600 text-lg">Đúng</th><th class="w-24 text-gray-600 text-lg">Sai</th></tr>`;
                
                q.statements.forEach((stmt, sIdx) => {
                    const letter = String.fromCharCode(97 + sIdx);
                    const savedState = savedAnswers.p2[q.id] ? savedAnswers.p2[q.id][sIdx] : null;
                    
                    let rowClass = "";
                    if (isQuestionChecked) {
                        const isCorrect = (savedState === 'true') === stmt.ans;
                        rowClass = isCorrect ? "bg-green-50" : (savedState ? "bg-red-50" : "");
                    }

                    tableHtml += `
                        <tr class="tf-row ${rowClass} transition-colors">
                            <td class="text-xl py-4 px-6">${letter}) ${stmt.t}</td>
                            <td><input type="radio" name="p2q${q.id}s${sIdx}" value="true" ${savedState === 'true' ? 'checked' : ''} ${disabledAttr} onchange="handleP2(${q.id}, ${sIdx}, 'true')" class="w-7 h-7"></td>
                            <td><input type="radio" name="p2q${q.id}s${sIdx}" value="false" ${savedState === 'false' ? 'checked' : ''} ${disabledAttr} onchange="handleP2(${q.id}, ${sIdx}, 'false')" class="w-7 h-7"></td>
                        </tr>`;
                });
                optsContainer.innerHTML = tableHtml + `</table></div>`;
            }
            else if (q.type === 'p3') {
                const savedVal = savedAnswers.p3[q.id] || '';
                
                let inputStyle = "border-gray-300 focus:border-green-500 focus:ring-green-200";
                if (isQuestionChecked) {
                    if (parseFloat(savedVal) === q.ans) inputStyle = "border-green-500 bg-green-50 text-green-700 font-bold";
                    else inputStyle = "border-red-500 bg-red-50 text-red-700";
                }

                optsContainer.innerHTML = `
                    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4 mt-2 p-6 bg-gray-50 rounded-xl border border-gray-200">
                        <span class="font-bold text-gray-700 text-xl whitespace-nowrap">Đáp án của bạn:</span>
                        <input type="number" step="any" id="p3-input-${q.id}" value="${savedVal}" ${disabledAttr} oninput="handleP3(${q.id}, this.value)" class="border-2 rounded-xl px-4 py-3 w-full sm:w-64 text-2xl outline-none focus:ring-4 transition-all ${inputStyle}">
                    </div>`;
                
                if (isQuestionChecked && parseFloat(savedVal) !== q.ans) {
                    optsContainer.innerHTML += `<div class="mt-4 text-green-600 font-bold text-xl">Đáp án đúng: ${q.ans}</div>`;
                }
            }

            // Gọi MathJax sau khi Render HTML để fix lỗi ký tự
            if(window.MathJax) {
                MathJax.typesetPromise([optsContainer]).catch((err) => console.log(err.message));
            }
        }

        function checkCurrentAnswer() {
            const q = questionsData[currentIndex];
            let isAnswered = false;
            
            if (q.type === 'p1') {
                isAnswered = savedAnswers.p1[q.id] !== undefined;
            } else if (q.type === 'p2') {
                isAnswered = savedAnswers.p2[q.id] && Object.keys(savedAnswers.p2[q.id]).length > 0;
            } else if (q.type === 'p3') {
                isAnswered = savedAnswers.p3[q.id] !== undefined && savedAnswers.p3[q.id] !== '';
            }

            const errorMsg = document.getElementById('check-error-msg');
            if (!isAnswered) {
                errorMsg.classList.remove('hidden');
                setTimeout(() => errorMsg.classList.add('hidden'), 3000);
                return;
            }
            
            errorMsg.classList.add('hidden');
            checkedQuestions[q.id] = true;
            localStorage.setItem('toan10_de4_checked', JSON.stringify(checkedQuestions));
            
            goToQuestion(currentIndex);
        }

        function handleP1(qId, val) {
            savedAnswers.p1[qId] = val;
            saveData();
            renderOptions(questionsData[currentIndex]);
        }

        function handleP2(qId, sIdx, val) {
            if(!savedAnswers.p2[qId]) savedAnswers.p2[qId] = {};
            savedAnswers.p2[qId][sIdx] = val;
            saveData();
        }

        function handleP3(qId, val) {
            if(val.trim() !== '') savedAnswers.p3[qId] = val;
            else delete savedAnswers.p3[qId];
            saveData();
        }

        function saveData() {
            localStorage.setItem('toan10_de4_game', JSON.stringify(savedAnswers));
        }

        function clearData() {
            localStorage.removeItem('toan10_de4_game');
            localStorage.removeItem('toan10_de4_checked');
            location.reload();
        }

        function submitExam() {
            isSubmitted = true;
            let totalScore = 0;

            questionsData.forEach((q) => {
                if (q.type === 'p1') {
                    if (savedAnswers.p1[q.id] === q.ans) totalScore += 0.25;
                } 
                else if (q.type === 'p2') {
                    let correctCount = 0;
                    q.statements.forEach((stmt, sIdx) => {
                        const userAns = savedAnswers.p2[q.id] ? savedAnswers.p2[q.id][sIdx] : null;
                        if (userAns && (userAns === 'true') === stmt.ans) correctCount++;
                    });
                    if(correctCount === 1) totalScore += 0.1;
                    if(correctCount === 2) totalScore += 0.25;
                    if(correctCount === 3) totalScore += 0.5;
                    if(correctCount === 4) totalScore += 1.0;
                } 
                else if (q.type === 'p3') {
                    const userVal = parseFloat(savedAnswers.p3[q.id]);
                    if (userVal === q.ans) totalScore += 0.5;
                }
            });

            document.getElementById('btn-submit').style.display = 'none';
            
            document.getElementById('final-score-text').innerText = totalScore.toFixed(2);
            const modal = document.getElementById('score-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => modal.classList.remove('opacity-0'), 50);

            goToQuestion(currentIndex);
        }

        function closeModal() {
            const modal = document.getElementById('score-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }
    </script>
</body>
</html>
